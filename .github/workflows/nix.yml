name: Nix CI

on:
  push:
    branches: [main, zisk-1.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  nix-build:
    name: Nix Build
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v16
        with:
          name: argumentcomputer
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # One step per package for separate logs; the store is shared across
      # steps, so nothing rebuilds.
      - run: nix build --print-build-logs --accept-flake-config .#cargo-zisk
      - run: nix build --print-build-logs --accept-flake-config .#ziskemu
      - run: nix build --print-build-logs --accept-flake-config .#zisk-home
      - run: nix build --print-build-logs --accept-flake-config .#zisk-toolchain
      - run: nix build --print-build-logs --accept-flake-config .#rustup-shim
      # Realize the dev shell so it's verified and pushed to the cache,
      # and smoke-test the toolchain entrypoint.
      - run: nix develop --print-build-logs --accept-flake-config --command cargo-zisk --version

  docker-image:
    name: Docker Image
    runs-on: warp-ubuntu-latest-x64-8x
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      # Rootless podman cannot create user namespaces on the runner (Ubuntu
      # 24.04 restricts unprivileged userns); use the rootful Docker daemon.
      # The image is what's under test, not the engine — locally the
      # zisk-shell/build-image wrappers still drive podman.
      - run: docker build -f docker/Dockerfile -t cargo-zisk:ci .
      # Exercise the flow zisk-shell drives: install the pinned release
      # binaries (--nokey: the proving key is a multi-GB download) and
      # smoke-test the installed toolchain.
      - run: |
          docker run --rm cargo-zisk:ci bash -c '
            set -ex
            ziskup --cpu --nokey -y
            cargo-zisk --version
            cargo-zisk-dev --version
          '
      # Publish the tested image, tagged by branch — zisk-shell pulls this by
      # default instead of requiring a local zisk-build. Only main and
      # blake3-precompile publish; this branch's pushes just build and test.
      # (PR tokens lack packages:write and must not overwrite tags anyway.)
      - if: github.event_name == 'push' && github.ref_name == 'main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          docker tag cargo-zisk:ci "ghcr.io/argumentcomputer/cargo-zisk:${{ github.ref_name }}"
          docker push "ghcr.io/argumentcomputer/cargo-zisk:${{ github.ref_name }}"
